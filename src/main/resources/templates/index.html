<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .form-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .form-group button:hover {
            background: #764ba2;
        }
        
        .message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }
        
        .todos-list {
            list-style: none;
        }
        
        .todo-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }
        
        .todo-item:hover {
            transform: translateX(5px);
        }
        
        .todo-item.completed {
            opacity: 0.6;
        }
        
        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }
        
        .todo-text {
            flex: 1;
        }
        
        .todo-title {
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
        }
        
        .todo-description {
            font-size: 14px;
            color: #666;
        }
        
        .todo-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-complete {
            background: #28a745;
            color: white;
        }
        
        .btn-complete:hover {
            background: #218838;
        }
        
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        
        .btn-delete:hover {
            background: #c82333;
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✓ My To-Do List</h1>
        
        <div th:if="${message}" class="message" th:text="${message}"></div>
        
        <form method="POST" action="/" class="form-group">
            <input type="text" name="title" placeholder="Add a new todo..." required>
            <input type="text" name="description" placeholder="Description (optional)">
            <button type="submit">Add</button>
        </form>
        
        <div th:if="${todos.isEmpty()}" class="empty-state">
            <div class="empty-state-icon">📝</div>
            <p>No todos yet. Add one to get started!</p>
        </div>
        
        <ul class="todos-list" th:if="${!todos.isEmpty()}">
            <li th:each="todo : ${todos}" class="todo-item" th:classappend="${todo.completed ? 'completed' : ''}">
                <div class="todo-text">
                    <div class="todo-title" th:text="${todo.title}"></div>
                    <div class="todo-description" th:text="${todo.description}"></div>
                </div>
                <div class="todo-actions">
                    <form method="POST" th:action="@{/complete/{id}(id=${todo.id})}" style="display: inline;">
                        <button type="submit" class="btn btn-complete" th:if="${!todo.completed}">Done</button>
                    </form>
                    <form method="POST" th:action="@{/delete/{id}(id=${todo.id})}" style="display: inline;">
                        <button type="submit" class="btn btn-delete" onclick="return confirm('Delete this todo?')">Delete</button>
                    </form>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
