version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: todo-postgres
    restart: always
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: sisonke
      POSTGRES_PASSWORD: Boyilani10*
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: todo-app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://todo-postgres:5432/taskdb
      SPRING_DATASOURCE_USERNAME: sisonke
      SPRING_DATASOURCE_PASSWORD: Boyilani10*
    restart: always

volumes:
  postgres_data: